[workspace]
resolver = "2"
members = ["crates/rustca-core", "crates/rustca-cli", "crates/rustca-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rustca-core = { path = "crates/rustca-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
