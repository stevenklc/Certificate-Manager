[workspace]
resolver = "2"
members = ["crates/rustca-core", "crates/rustca-cli", "crates/rustca-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustca-core = { path = "crates/rustca-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# RSA 金鑰產生在 debug 模式非常慢，相關套件一律最佳化
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
