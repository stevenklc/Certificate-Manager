[package]
name = "rustca-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "憑證管理工具 Certificate Manager：圖形介面（Windows）"

[[bin]]
name = "rust-ca-gui"
path = "src/main.rs"

[dependencies]
rustca-core.workspace = true
anyhow.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = "0.31"
rfd = "0.15"

# GUI 以 Windows 為目標；Linux 只開 X11 後端，方便開發時編譯檢查
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }
